name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # to post the preview URL comment

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy preview to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Deploy to a PR-specific preview name so previews don't overwrite each other
        run: |
          PREVIEW_NAME="mook-ai-portfolio-pr-${{ github.event.pull_request.number }}"
          OUTPUT=$(pnpm wrangler deploy --name "$PREVIEW_NAME" --dry-run 2>&1 || true)
          pnpm wrangler deploy --name "$PREVIEW_NAME" 2>&1
          echo "preview_name=$PREVIEW_NAME" >> "$GITHUB_OUTPUT"

      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewName = '${{ steps.deploy.outputs.preview_name }}';
            const previewUrl = `https://${previewName}.${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview deployment\n\n🚀 **${previewUrl}**\n\nWorker name: \`${previewName}\``
            });
